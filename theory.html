<style>
:root { --ground:#f2f5f1; --surface:#fff; --ink:#12292e; --muted:#4f6569; --line:#d3dfd8; --teal:#0a7a69; --teal-ink:#fff; --bad:#b42318; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --ground:#0d181b; --surface:#132327; --ink:#e3edea; --muted:#9ab0ab; --line:#253b3f; --teal:#4fc4ab; --teal-ink:#08201b; --bad:#ff8a7a; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--ground); color: var(--ink);
  font: 400 15px/1.5 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; }
.card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 26px 24px; display: grid; gap: 14px; }
.eyebrow { font: 600 12px/1.2 "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); }
h1 { margin: 0; font: 700 30px/1.1 "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; }
p { margin: 0; color: var(--muted); }
form { display: grid; gap: 12px; }
label { display: grid; gap: 4px; font-size: 13px; }
input { height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: inherit; padding: 0 10px; font: inherit; }
button { height: 40px; border: 1px solid var(--teal); border-radius: 8px; background: var(--teal); color: var(--teal-ink); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.err { color: var(--bad); min-height: 1.2em; font-size: 13.5px; }
.wip { font: 600 10.5px/1 "IBM Plex Sans Condensed", "Arial Narrow", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; vertical-align: middle; margin-left: 6px; }
</style>

    var b = document.getElementById("b"), e = document.getElementById("e"), p = document.getElementById("p");
    b.disabled = true; b.textContent = "Decrypting…"; e.textContent = "";
    open(document.getElementById("u").value.trim() || "Studycase", p.value).catch(function (err) {
      e.textContent = err && err.message === "NO_WEBCRYPTO" ? "WebCrypto requires HTTPS or localhost." : "Wrong password.";
      b.disabled = false; b.textContent = "Open the lab"; p.focus(); p.select();
    });
  });
})();
</script>
